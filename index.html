<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finals FPS Game</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#111; }
#hud { position:fixed; top:12px; left:12px; z-index:10; display:flex; gap:10px; }
.panel { background:rgba(0,0,0,.45); padding:8px 12px; border-radius:8px; color:#fff; }
#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; color:#fff; font-size:18px; z-index:10; }
#message { position:fixed; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; color:#fff; pointer-events:none; font-size:18px; text-align:center; }
</style>
</head>
<body>

<div id="hud">
  <div class="panel">Score: <span id="score">0</span></div>
  <div class="panel">Wave: <span id="wave">0</span></div>
  <div class="panel">HP: <span id="hp">100</span></div>
  <div class="panel">Enemies: <span id="enCount">0</span></div>
</div>
<div id="crosshair">+</div>
<div id="message">Click to start • WASD to move • Mouse to look • Space to jump • Shift to sprint • Left Click to shoot</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/PointerLockControls.js"></script>

<script>
let score=0, wave=0;
const hudScore=document.getElementById('score');
const hudWave=document.getElementById('wave');
const hudHp=document.getElementById('hp');
const hudEnemies=document.getElementById('enCount');
const message=document.getElementById('message');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));
const dir=new THREE.DirectionalLight(0xffffff,0.6);
dir.position.set(5,10,5); scene.add(dir);

// Floor
const floorGeo=new THREE.PlaneGeometry(200,200);
const floorMat=new THREE.MeshStandardMaterial({color:0x228822});
const floor=new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x=-Math.PI/2; scene.add(floor);

// Player
const player={x:0,y:1.6,z:0,hp:100,speed:6,isJumping:false,velocityY:0,gravity:20,jumpSpeed:8};
camera.position.set(player.x,player.y,player.z);

// Controls
const controls=new THREE.PointerLockControls(camera,renderer.domElement);
message.addEventListener('click',()=>{ controls.lock(); });
controls.addEventListener('lock',()=>{ message.style.display='none'; });
controls.addEventListener('unlock',()=>{ message.style.display='flex'; message.textContent='Pointer unlocked. Click to lock again.'; });

// Weapon
const weaponGeo=new THREE.BoxGeometry(0.2,0.15,0.6);
const weaponMat=new THREE.MeshStandardMaterial({color:'#333'});
const weapon=new THREE.Mesh(weaponGeo,weaponMat);
weapon.position.set(0,-0.15,-0.5);
camera.add(weapon);
scene.add(camera);

// Enemies
const enemies=[];
function makeEnemy(){
  const g=new THREE.SphereGeometry(0.6,16,12);
  const m=new THREE.MeshStandardMaterial({color:0xff5555});
  const mesh=new THREE.Mesh(g,m);
  const angle=Math.random()*Math.PI*2;
  mesh.position.set(Math.cos(angle)*80,0.6,Math.sin(angle)*80);
  scene.add(mesh);
  return {mesh:mesh,hp:30+wave*8,speed:1.5+wave*0.2};
}

// HUD
function updateUI(){ hudScore.textContent=score; hudWave.textContent=wave; hudHp.textContent=Math.max(0,Math.floor(player.hp)); hudEnemies.textContent=enemies.length; }

// Wave
function nextWave(){ wave++; const num=3+Math.floor(wave*2.2); for(let i=0;i<num;i++) enemies.push(makeEnemy()); updateUI(); }
nextWave();

// Shooting
const raycaster=new THREE.Raycaster();
let lastShot=0,shootCooldown=0.12;
function shoot(){ if(!controls.isLocked) return; const now=performance.now()/1000; if(now-lastShot<shootCooldown) return; lastShot=now;
  const origin=camera.getWorldPosition(new THREE.Vector3());
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  raycaster.set(origin,dir);
  const hits=raycaster.intersectObjects(enemies.map(e=>e.mesh));
  if(hits.length>0){ const en=enemies.find(x=>x.mesh===hits[0].object); if(en){ en.hp-=20; if(en.hp<=0) killEnemy(en); } }
  weapon.position.z=-0.3; setTimeout(()=>{weapon.position.z=-0.5},80);
}
window.addEventListener('mousedown', e=>{ if(e.button===0) shoot(); });
function killEnemy(en){ score+=150+wave*10; scene.remove(en.mesh); enemies.splice(enemies.indexOf(en),1); updateUI(); }

// Movement
const keys={w:false,a:false,s:false,d:false,shift:false,space:false};
window.addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); if(k in keys) keys[k]=true; });
window.addEventListener('keyup', e=>{ const k=e.key.toLowerCase(); if(k in keys) keys[k]=false; });

// Animate
let prevTime=performance.now()/1000;
function animate(){
  const now=performance.now()/1000; const dt=Math.min(0.05,now-prevTime); prevTime=now;

  if(controls.isLocked){
    const speed=keys.shift?player.speed*2:player.speed;
    const dirVec=new THREE.Vector3();
    if(keys.w) dirVec.z-=1; if(keys.s) dirVec.z+=1; if(keys.a) dirVec.x-=1; if(keys.d) dirVec.x+=1;
    if(dirVec.length()>0){ dirVec.normalize(); const euler=new THREE.Euler(0,camera.rotation.y,0,'YXZ'); dirVec.applyEuler(euler); player.x+=dirVec.x*speed*dt; player.z+=dirVec.z*speed*dt; }
    // Jumping
    if(keys.space&&!player.isJumping){ player.velocityY=player.jumpSpeed; player.isJumping=true; }
    player.velocityY -= player.gravity*dt;
    player.y += player.velocityY*dt;
    if(player.y<=1.6){ player.y=1.6; player.velocityY=0; player.isJumping=false; }

    player.x=Math.min(Math.max(player.x,-98),98);
    player.z=Math.min(Math.max(player.z,-98),98);
    controls.getObject().position.set(player.x,player.y,player.z);
  }

  // Enemies
  for(const en of enemies){
    const dx=player.x-en.mesh.position.x;
    const dz=player.z-en.mesh.position.z;
    const d=Math.hypot(dx,dz)||0.001;
    en.mesh.position.x+=dx/d*en.speed*dt;
    en.mesh.position.z+=dz/d*en.speed*dt;
    if(Math.hypot(player.x-en.mesh.position.x,player.z-en.mesh.position.z)<1.2){ player.hp-=12*dt; if(player.hp<=0){ message.style.display='flex'; message.textContent='Eliminated! Press R to restart.'; controls.unlock(); } }
  }

  if(enemies.length===0){ nextWave(); }

  updateUI();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
