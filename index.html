<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finals FPS Game</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#111; }
#hud { position:fixed; top:12px; left:12px; z-index:10; display:flex; gap:10px; }
.panel { background:rgba(0,0,0,.45); padding:8px 12px; border-radius:8px; color:#fff; }
#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; color:#fff; font-size:18px; z-index:10; }
#message { position:fixed; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; color:#fff; pointer-events:none; font-size:18px; text-align:center; }
</style>
</head>
<body>

<div id="hud">
  <div class="panel">Score: <span id="score">0</span></div>
  <div class="panel">Wave: <span id="wave">0</span></div>
  <div class="panel">HP: <span id="hp">100</span></div>
  <div class="panel">Enemies: <span id="enCount">0</span></div>
</div>
<div id="crosshair">+</div>
<div id="message">Click to start • WASD to move • Mouse to look • Left Click to shoot</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/PointerLockControls.js"></script>

<script>
// HUD elements
const scoreEl = document.getElementById('score');
const waveEl = document.getElementById('wave');
const hpEl = document.getElementById('hp');
const enCountEl = document.getElementById('enCount');
const message = document.getElementById('message');

let score = 0, wave = 0;

// Three.js setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lighting
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.6);
dir.position.set(5,10,5);
scene.add(dir);

// PointerLock controls
const controls = new THREE.PointerLockControls(camera, renderer.domElement);
message.addEventListener('click', ()=>{ controls.lock(); });
controls.addEventListener('lock', ()=>{ message.style.display='none'; });
controls.addEventListener('unlock', ()=>{ message.style.display='flex'; message.textContent='Pointer unlocked. Click to lock again.'; });

// Floor
const floorGeo = new THREE.PlaneGeometry(200,200,10,10);
const floorMat = new THREE.MeshStandardMaterial({color:0x228822});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// Player
const player = { x:0, y:1.6, z:0, hp:100, speed:6 };
camera.position.set(player.x, player.y, player.z);
camera.lookAt(0,0,0);
controls.getObject().position.copy(camera.position);

// Weapon
const weaponGeo = new THREE.BoxGeometry(0.2,0.15,0.6);
const weaponMat = new THREE.MeshStandardMaterial({color:'#333'});
const weapon = new THREE.Mesh(weaponGeo, weaponMat);
weapon.position.set(0,-0.15,-0.5);
camera.add(weapon);
scene.add(camera);

// Enemies
const enemies = [];
function makeEnemy(){
  const g = new THREE.SphereGeometry(0.6,16,12);
  const m = new THREE.MeshStandardMaterial({color:0xff5555});
  const mesh = new THREE.Mesh(g,m);
  const angle = Math.random()*Math.PI*2;
  mesh.position.set(Math.cos(angle)*80,0.6,Math.sin(angle)*80);
  scene.add(mesh);
  return {mesh:mesh,hp:30+wave*8,speed:1.5+wave*0.2};
}

// HUD update
function updateUI(){
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  hpEl.textContent = Math.max(0, Math.floor(player.hp));
  enCountEl.textContent = enemies.length;
}

// Waves
let spawnTimer = 0;
function nextWave(){
  wave++;
  const num = 3 + Math.floor(wave*2.2);
  for(let i=0;i<num;i++) enemies.push(makeEnemy());
  updateUI();
}

// Shooting
const raycaster = new THREE.Raycaster();
let lastShot=0, shootCooldown=0.12;
function shoot(){
  if(!controls.isLocked) return;
  const now = performance.now()/1000;
  if(now-lastShot<shootCooldown) return; lastShot=now;
  const origin = camera.getWorldPosition(new THREE.Vector3());
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  raycaster.set(origin,dir);
  const hits = raycaster.intersectObjects(enemies.map(e=>e.mesh));
  if(hits.length>0){
    const en = enemies.find(x=>x.mesh===hits[0].object);
    if(en){ en.hp-=20; if(en.hp<=0) killEnemy(en); }
  }
  weapon.position.z = -0.3; setTimeout(()=>{weapon.position.z=-0.5},80);
}
window.addEventListener('mousedown', e=>{ if(e.button===0) shoot(); });

// Kill enemy
function killEnemy(en){
  score += 150 + wave*10;
  scene.remove(en.mesh);
  const idx = enemies.indexOf(en); if(idx>=0) enemies.splice(idx,1);
  updateUI();
}

// Player movement
const keys={w:false,a:false,s:false,d:false,shift:false};
window.addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); if(k in keys) keys[k]=true; if(k==='r') resetGame(); });
window.addEventListener('keyup', e=>{ const k=e.key.toLowerCase(); if(k in keys) keys[k]=false; });

// Enemy AI
function updateEnemies(dt){
  for(const en of enemies){
    const pos = en.mesh.position;
    const dx = player.x - pos.x;
    const dz = player.z - pos.z;
    const d = Math.hypot(dx,dz)||0.001;
    const nx = dx/d, nz = dz/d;
    pos.x += nx*en.speed*dt;
    pos.z += nz*en.speed*dt;
    const distToPlayer = Math.hypot(pos.x-player.x,pos.z-player.z);
    if(distToPlayer<1.2){ player.hp -= 12*dt; if(player.hp<=0) onGameOver(); updateUI(); }
  }
}

// Game over
function onGameOver(){ controls.unlock(); message.style.display='flex'; message.textContent='Eliminated! Press R to restart.'; }

// Wave progression
function maybeSpawn(dt){
  spawnTimer += dt;
  if(spawnTimer > 0.6){
    spawnTimer = 0;
    if(enemies.length < Math.min(16,5+wave*3)){ enemies.push(makeEnemy()); updateUI(); }
  }
}

// Animation loop
let prevTime = performance.now()/1000;
function animate(){
  const now = performance.now()/1000;
  const dt = Math.min(0.05, now-prevTime);
  prevTime = now;

  // Movement
  if(controls.isLocked){
    const speed = keys.shift ? player.speed*1.6 : player.speed;
    const dir = new THREE.Vector3();
    if(keys.w) dir.z -= 1; if(keys.s) dir.z += 1; if(keys.a) dir.x -= 1; if(keys.d) dir.x += 1;
    if(dir.length()>0){ dir.normalize(); const euler = new THREE.Euler(0,camera.rotation.y,0,'YXZ'); dir.applyEuler(euler); player.x += dir.x*speed*dt; player.z += dir.z*speed*dt; }
    player.x = THREE.MathUtils.clamp(player.x,-98,98); player.z = THREE.MathUtils.clamp(player.z,-98,98);
    controls.getObject().position.set(player.x,player.y,player.z);
  }

  updateEnemies(dt);
  maybeSpawn(dt);

  if(enemies.length===0){ spawnTimer += dt; if(spawnTimer>1.3){ spawnTimer=0; nextWave(); } }

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}

// Reset game
function resetGame(){ for(const e of enemies) scene.remove(e.mesh); enemies.length=0; score=0; player.hp=100; wave=0; spawnTimer=0; nextWave(); updateUI(); message.style.display='none'; controls.lock(); }

nextWave(); animate();
</script>
</body>
</html>
